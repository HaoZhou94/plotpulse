server:
  host: 127.0.0.1
  port: 8000

logging:
  level: INFO

storage:
  database_path: ./data/plotpulse.db

worker:
  max_workers: 1

media:
  ffprobe_bin: ffprobe
  ffprobe_timeout_seconds: 60
  max_video_duration_seconds: 21600
  allow_local_media: false
  allowed_hosts:
    - media.example.com

callback:
  allowed_hosts:
    - java.example.com
  hmac_secret: ""
  timeout_seconds: 10

# Private model parameters are intentionally left empty.
algorithms:
  shot_detection:
    model_path: ./models/svm.joblib
    scaler_path: ./models/scaler.joblib
    minimum_decode_ratio: 0.95
    skip_start_seconds: 0
    skip_end_seconds: 0
    merge_window_frames: 3
    minimum_shot_seconds: 0.3
    open_timeout_ms: 120000
    read_timeout_ms: 120000
  audio_detection: {}
  ocr_detection: {}
  visual_analysis: {}
  timeline_fusion: {}
  semantic_analysis: {}
  scene_segmentation:
    candidate_window_seconds: 3.0
    minimum_scene_seconds: 5.0
    speech_guard_seconds: 0.2
    enable_music_beats: true
  plot_segmentation: {}
  chapter_generation: {}
